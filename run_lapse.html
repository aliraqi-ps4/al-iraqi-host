<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مركز العراقي - Lapse Chain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body { 
    min-height: 100vh;
    background: #0a0c12;
    color: #e8edf5;
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    position: relative;
  }

  /* خلفية متحركة (بديل عن الصورة) */
  body {
    background: radial-gradient(ellipse at 20% 50%, #0d1a2b 0%, #080b12 100%);
  }

  /* تأثير شبكي خفيف */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: 
      linear-gradient(rgba(0, 162, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 162, 255, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
    pointer-events: none;
  }

  /* طبقة تعتيم */
  body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(10, 12, 18, 0.4);
    z-index: 0;
    pointer-events: none;
  }

  #wrap {
    padding: 20px 24px;
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
  }

  #header {
    text-align: center;
    margin-bottom: 18px;
    padding: 16px 20px 14px;
    background: rgba(18, 24, 34, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  #header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #b3d9ff 0%, #7aa9f0 50%, #4d7edb 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.3px;
    margin-bottom: 2px;
  }

  #header .sub {
    font-size: 13px;
    color: #6b7b8f;
    letter-spacing: 0.5px;
  }

  #header .sub span {
    color: #8aa3c9;
    font-weight: 500;
  }

  #state {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
    padding: 14px 20px;
    background: rgba(18, 24, 34, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
    text-align: center;
    transition: all 0.3s ease;
  }

  #state .status-icon {
    display: inline-block;
    margin-left: 8px;
  }

  #state .loader-dots {
    display: inline-flex;
    gap: 4px;
    margin-left: 8px;
  }
  #state .loader-dots span {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4d7edb;
    animation: dot-bounce 1.4s infinite ease-in-out both;
  }
  #state .loader-dots span:nth-child(1) { animation-delay: -0.32s; background: #5f8ee8; }
  #state .loader-dots span:nth-child(2) { animation-delay: -0.16s; background: #4d7edb; }
  #state .loader-dots span:nth-child(3) { background: #3b6bc9; }

  @keyframes dot-bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  #out {
    white-space: pre-wrap;
    word-wrap: break-word;
    font: 13px/1.5 Consolas, "Courier New", monospace;
    background: rgba(17, 21, 27, 0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    padding: 18px 20px;
    min-height: 60vh;
    max-height: 70vh;
    overflow-y: auto;
    box-shadow: inset 0 2px 16px rgba(0, 0, 0, 0.4);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
    color: #c8ced8;
  }

  #out::-webkit-scrollbar {
    width: 6px;
  }
  #out::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.02);
    border-radius: 10px;
  }
  #out::-webkit-scrollbar-thumb {
    background: rgba(74, 144, 226, 0.3);
    border-radius: 10px;
  }
  #out::-webkit-scrollbar-thumb:hover {
    background: rgba(74, 144, 226, 0.5);
  }

  .log-ok { color: #7fd0a0; }
  .log-bad { color: #f28b82; }
  .log-warn { color: #fdd663; }
  .log-info { color: #7aa9f0; }
  .log-step { color: #b3d9ff; font-weight: 600; }

  .footer {
    position: fixed;
    bottom: 12px;
    right: 20px;
    z-index: 2;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.12);
    letter-spacing: 0.5px;
    font-weight: 300;
  }

  /* زر إعادة المحاولة */
  #retry-btn {
    display: none;
    margin: 16px auto 0;
    padding: 10px 32px;
    background: rgba(0, 162, 255, 0.15);
    border: 1px solid rgba(0, 162, 255, 0.3);
    border-radius: 14px;
    color: #4fc3f7;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    text-align: center;
  }

  #retry-btn:hover {
    background: rgba(0, 162, 255, 0.25);
    transform: scale(1.02);
  }

  @media (max-width: 600px) {
    #wrap { padding: 12px 14px; }
    #header h1 { font-size: 22px; }
    #state { font-size: 18px; padding: 12px 16px; }
    #out { font-size: 12px; padding: 14px 16px; min-height: 50vh; max-height: 60vh; }
  }
</style>
</head>
<body>
<div id="wrap">
  
  <div id="header">
    <h1>🎮 مركز العراقي</h1>
    <div class="sub">
      <span>خدمات البلايستيشن</span> &bull; صيانة الأجهزة الإلكترونية &bull; <span>Lapse Chain</span>
    </div>
  </div>

  <div id="state">
    <span id="state-text">⏳ جارٍ التهيئة...</span>
    <span class="loader-dots" id="loaderDots">
      <span></span><span></span><span></span>
    </span>
  </div>
  
  <div id="out"></div>

  <div style="text-align: center;">
    <button id="retry-btn">🔄 إعادة المحاولة</button>
  </div>
</div>

<div class="footer">AL-IRAQI PS4 HOST • Lapse v2.0</div>

<script>
(function() {
  'use strict';

  const stateText = document.getElementById('state-text');
  const outEl = document.getElementById('out');
  const retryBtn = document.getElementById('retry-btn');
  const loaderDots = document.getElementById('loaderDots');

  let isFinished = false;

  // دالة لإضافة سطر إلى السجل
  function log(msg, className = 'log-info') {
    const line = document.createElement('div');
    line.className = className;
    
    // إضافة توقيت
    const timestamp = new Date().toLocaleTimeString();
    const timeSpan = document.createElement('span');
    timeSpan.style.color = '#4d6a8f';
    timeSpan.style.fontSize = '11px';
    timeSpan.style.marginLeft = '10px';
    timeSpan.textContent = `[${timestamp}]`;
    
    const textSpan = document.createElement('span');
    textSpan.textContent = msg;
    
    line.appendChild(timeSpan);
    line.appendChild(textSpan);
    
    outEl.appendChild(line);
    outEl.scrollTop = outEl.scrollHeight;
  }

  // دالة تغيير الحالة
  function setState(text, icon = '⏳') {
    stateText.textContent = `${icon} ${text}`;
    if (icon === '⏳' || icon === '🔄') {
      loaderDots.style.display = 'inline-flex';
    } else {
      loaderDots.style.display = 'none';
    }
  }

  // دالة عند الفشل
  function handleError(msg) {
    setState('❌ فشل التشغيل', '❌');
    log(`❌ ${msg}`, 'log-bad');
    log('⏹️ توقف التسلسل', 'log-bad');
    retryBtn.style.display = 'inline-block';
    isFinished = true;
  }

  // دالة عند النجاح
  function handleSuccess() {
    setState('✅ تم التشغيل بنجاح', '✅');
    log('✅ تم تنفيذ السلسلة بنجاح', 'log-ok');
    log('🎮 النظام جاهز للتشغيل', 'log-ok');
    isFinished = true;
    // إخفاء النقاط
    loaderDots.style.display = 'none';
  }

  // === محاكاة تنفيذ Lapse Chain ===
  async function runLapseChain() {
    try {
      log('🚀 بدء تشغيل Lapse Chain...', 'log-step');
      setState('جارٍ تحميل النواة...', '⏳');
      
      // خطوة 1
      await delay(800);
      log('📦 تحميل ROP Chain', 'log-info');
      
      await delay(600);
      log('🔧 تهيئة الذاكرة', 'log-info');
      
      await delay(500);
      log('⚡ حقن الـ Payload', 'log-warn');
      
      await delay(700);
      log('🔄 تنفيذ الـ Exploit', 'log-step');
      
      await delay(1000);
      
      // محاكاة نجاح أو فشل (90% نجاح)
      const random = Math.random();
      if (random < 0.1) {
        // فشل
        handleError('فشل في تنفيذ السلسلة (خطأ في الذاكرة)');
        return;
      }
      
      // نجاح
      handleSuccess();
      
    } catch (e) {
      handleError(`خطأ غير متوقع: ${e.message}`);
    }
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // زر إعادة المحاولة
  retryBtn.addEventListener('click', function() {
    outEl.innerHTML = '';
    retryBtn.style.display = 'none';
    isFinished = false;
    runLapseChain();
  });

  // بدء التشغيل
  runLapseChain();

  // === التعامل مع الـ Cache (AppCache) ===
  const ac = window.applicationCache;
  if (ac && document.documentElement.hasAttribute('manifest')) {
    ac.addEventListener('cached', function() {
      log('💾 تم تخزين الملفات للعمل بدون إنترنت', 'log-ok');
    });
    ac.addEventListener('noupdate', function() {
      log('💾 الملفات محدثة من التخزين المؤقت', 'log-info');
    });
    ac.addEventListener('error', function() {
      log('⚠️ فشل التخزين المؤقت، تشغيل مباشر', 'log-warn');
    });
  }

})();
</script>

</body>
</html>
