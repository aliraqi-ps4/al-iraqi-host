<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مركز العراقي — PS4 Lapse</title>
<style>

  #state { font-size:22px; font-weight:700; margin:0 0 10px; text-align: center; color: #fdd663; }

         background:#11151b; border:1px solid #1e2732; border-radius:8px;
         padding:10px 12px; height:calc(100vh - 141px); overflow-y:auto;
         direction:ltr; text-align:left; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:12px; background:#0e1116;
           border-bottom:1px solid #1e2732; direction:rtl; }
  #brand b { font-size:16px; font-weight:700; color:#e6ebf2; vertical-align:middle; }
  #brand .phones { color:#7fd0a0; font-weight:700; margin-right:12px; direction:ltr; display:inline-block; vertical-align:middle; }
</style>
</head>
<body>
<div id="brand">
  <b>مركز العراقي لخدمات البلايستيشن</b>
  <span class="phones">01006815002 - 01013321226</span>
</div>
