<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مركز العراقي | PS4 13.00 Webkit Exploit</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #05070c;
      color: #e8edf5;
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      width: min(500px, 90%);
      padding: 35px 25px;
      border-radius: 25px;
      background: rgba(10, 20, 38, 0.85);
      border: 1px solid rgba(90, 160, 255, 0.3);
      box-shadow: 0 0 40px rgba(0, 100, 255, 0.25);
    }

    h1 {
      color: #e5f5ff;
      font-size: 32px;
      margin-bottom: 5px;
      text-shadow: 0 0 15px rgba(70, 150, 255, 0.8);
    }

    .sub {
      color: #65b8ff;
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .status-box {
      padding: 20px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #status {
      font-size: 20px;
      font-weight: bold;
      color: #fdd663;
      margin-bottom: 8px;
    }

    .loader {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #4d9dff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>مركز العراقي</h1>
    <div class="sub">PS4 FW 13.00 WEBKIT EXPLOIT</div>

    <div class="status-box">
      <div id="status">جارٍ تشغيل ثغرة Webkit...</div>
      <small style="color: #9baac0;">يرجى الانتظار وعدم إغلاق المتصفح</small>
      <br>
      <div id="loader" class="loader"></div>
    </div>
  </div>

  <!-- استدعاء سكربت الثغرة الرئيسي -->
  <script type="module" src="chain_poops.js"></script>

  <script>
    window.poopsDone = function() {
      document.getElementById("status").style.color = "#7fd0a0";
      document.getElementById("status").innerText = "تم اختراق الـ Webkit بنجاح!";
      document.getElementById("loader").style.display = "none";
    };

    window.poopsError = function() {
      document.getElementById("status").style.color = "#f28b82";
      document.getElementById("status").innerText = "فشل التشغيل، أعد محاولة فتح الصفحة.";
      document.getElementById("loader").style.display = "none";
    };
  </script>
</body>
</html>
