<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مركز العراقى — PS4 Poops</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 10px; }
  #out { white-space:pre-wrap; font:12px/1.45 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px;
         padding:10px 12px; height:calc(100vh - 141px); overflow-y:auto;
         direction:ltr; text-align:left; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:10px 12px; background:#0e1116;
           border-bottom:1px solid #1e2732; direction:rtl; }
  #brand img { width:28px; height:28px; margin-left:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; color:#e6ebf2; vertical-align:middle; }
  #brand .phones { color:#7fd0a0; font-weight:700; margin-right:8px; direction:ltr; display:inline-block; vertical-align:middle; }
</style>
</head>
<body>
<div id="brand">
  <img src="logo_raw.png" alt="" width="28" height="28">
  <b>مركز العراقى لخدمات البلايستيشن</b>
  <span class="phones">01006815002 - 01013321226</span>
</div>
<div id="wrap">
  <div id="state">jarii tahmil poops chain...</div>
  <div id="out"></div>
</div>

<script>
  // متابعة حالة التخزين أوفلاين من المتصفح
  const stateEl = document.getElementById("state");
  const outEl = document.getElementById("out");

  if (window.applicationCache) {
    window.applicationCache.addEventListener('cached', () => {
      stateEl.innerHTML = "<span class='ok'>تم حفظ الهوست أوفلاين بنجاح!</span>";
    });
    window.applicationCache.addEventListener('noupdate', () => {
      stateEl.innerHTML = "loading poops chain...";
    });
    window.applicationCache.addEventListener('error', () => {
      // في حالة العمل أوفلاين بالكامل مسبقاً
      stateEl.innerHTML = "loading poops chain (Offline Mode)...";
    });
  }
</script>

<script type="module">import "./chain_poops.js";</script>
</body>
</html>
